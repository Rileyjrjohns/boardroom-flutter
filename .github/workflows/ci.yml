# The checks every change has to pass, in three jobs that run in parallel (the import rules of the
# architecture, everything else, and the parity of the tests with the React Native app) and in
# steps, so that the one that fails is the first thing the run page shows. They are the commands
# listed in the "Checks" section of the README, so anyone can run them locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels the run of the previous one. The group has the ref in it, so a pull
# request and main never cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reads the code and nothing else. No secret is used here, so a pull request from a fork runs the
# same checks.
permissions:
  contents: read

jobs:
  # Pinned to ubuntu-24.04: GitHub began moving ubuntu-latest to Ubuntu 26 on 19 October 2026.

  # The layers may only import what the architecture allows (see the README.md of lib/core, of each
  # folder of lib/features and of lib/app). This job runs the checker alone, beside the job below, so
  # that a broken boundary fails a check of its own that is named after it.
  imports:
    name: Import rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # The Flutter version is read from environment.flutter in pubspec.yaml, the one place where
      # it is pinned. The SDK is cached between runs.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install the dependencies
        run: flutter pub get

      - name: Check the import rules
        run: dart run tool/check_imports.dart

  checks:
    name: Analyze, format, tests, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      # Also generates the localization classes (lib/l10n/app_localizations*.dart, not committed):
      # gen-l10n runs as part of `flutter pub get`, so no separate step is needed.
      - name: Install the dependencies
        run: flutter pub get

      # The freezed classes of the domain folders (*.freezed.dart) and the JSON and drift code (*.g.dart)
      # are not committed: the analysis and the tests need them.
      - name: Generate the code (build_runner)
        run: dart run build_runner build

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # The tests of the pure Dart folders (the domain and application folders of test/core and of
      # each feature in test/features, the fakes in test/support/fakes, and the tooling in test/tool)
      # run with `dart test`, not `flutter test`: that is the proof that the domain, the application
      # and the tooling need no Flutter. test/core/infrastructure holds Flutter tests, so only the
      # domain and application folders of core run here. A folder with no test file yet is skipped,
      # because `dart test` fails on a folder that has none.
      - name: Pure Dart tests (without Flutter)
        run: |
          folders=()
          for folder in test/core/domain test/core/application test/features/*/domain test/features/*/application test/support/fakes test/tool; do
            if [ -n "$(find "$folder" -name '*_test.dart' -print -quit 2>/dev/null)" ]; then
              folders+=("$folder")
            fi
          done
          if [ "${#folders[@]}" -eq 0 ]; then
            echo "No pure Dart test yet."
            exit 0
          fi
          echo "dart test ${folders[*]}"
          dart test "${folders[@]}"

      # The adapters, on their own so that a failure of one is named after it: dio against the fixture
      # server, drift on files and in memory, the contract suites of the ports run against every adapter
      # (test/core/infrastructure, the infrastructure folders of the features, test/app for the
      # simulated world and the database, and the tests of the support code they use).
      # The tests open an encrypted SQLite file. The native library (SQLite3MultipleCiphers) comes from the
      # build hook of package:sqlite3, which downloads the prebuilt library for the runner and checks its
      # hash, so the runner installs no package. They need Flutter (plugins, assets), so `dart test` cannot
      # run them.
      - name: Infrastructure tests (dio on the fixtures, drift, encrypted SQLite)
        run: flutter test test/core/infrastructure test/features/*/infrastructure test/app test/support/infrastructure

      # Writes test/coverage_helper_test.dart, which imports every library of lib/: a file that no
      # test loads would be missing from the coverage report instead of counting as 0 percent.
      - name: Load every library for the coverage
        run: dart run tool/coverage_helper.dart

      # Runs every test again, the infrastructure ones included, to measure the coverage.
      - name: Flutter tests with coverage
        run: flutter test --coverage

      # The coverage as a table on the page of the run, and the gates: 90 percent of lines for each of
      # the two scopes that hold the rules (the domain folders, lib/core/domain and lib/features/*/domain,
      # and the application folders), 70 percent for the rest together. The table goes to
      # the summary, the failures to the log, and the exit code of the script fails the step (a
      # redirection does not hide it).
      - name: Coverage gate
        run: dart run tool/coverage_gate.dart >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # The Flutter tests of the domain and of the application are the scenarios of the React Native
  # ones, one for one: same names, same assertions. The React Native repository is checked out at the
  # commit that docs/parity/RN_COMMIT pins, so that a change on its side is a decision (a new commit
  # in that file) and never a surprise. The script (tool/scenario_parity.dart) reads its test
  # sources, asks `dart test` for the names of the Dart tests, and fails on any difference that
  # docs/parity/exceptions.md and docs/parity/extras.md do not explain.
  parity:
    name: Scenario parity with React Native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Read the pinned React Native commit
        id: rn
        run: echo "commit=$(tr -d '[:space:]' < docs/parity/RN_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Check out the React Native repository
        uses: actions/checkout@v7
        with:
          repository: Rileyjrjohns/boardroom
          ref: ${{ steps.rn.outputs.commit }}
          path: boardroom-rn

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install the dependencies
        run: flutter pub get

      - name: Generate the code (build_runner)
        run: dart run build_runner build

      - name: Compare the scenarios
        run: dart run tool/scenario_parity.dart --rn boardroom-rn
