# Builds the signed iOS and Android releases with Fastlane on a version tag, and uploads them to
# TestFlight and to the internal track of Google Play (docs/delivery.md).
#
# NOTHING IS DEPLOYED FROM THIS REPOSITORY. Every step that signs or uploads is gated on the secrets
# of the stores, and this repository has none: a tag runs the `verify` job (the tag against the
# version of pubspec.yaml), says in the run summary which platform is skipped and why, and the two
# platform jobs are skipped (a skipped job is not a failure). A tag also runs the CI (ci.yml) first,
# and no platform is built if it fails. A real project adds the secrets listed
# in docs/delivery.md and the same workflow then builds and uploads, with no change.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A second run for the same ref waits for the first instead of cancelling it: an upload that is under
# way must not be cut off.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Reads the code and nothing else. The stores are reached with their own credentials (the secrets
# below), never with the token of GitHub.
permissions:
  contents: read

jobs:
  # Pinned to ubuntu-24.04: GitHub began moving ubuntu-latest to Ubuntu 26 on 19 October 2026.

  # Cheap and always run: checks the tag, and decides which platform has what it needs. A secret
  # cannot be read in the `if:` of a job, so this job turns the presence of each into an output.
  verify:
    name: Check the tag and the secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.secrets.outputs.ios }}
      android: ${{ steps.secrets.outputs.android }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # A tag is the version of pubspec.yaml (the part before the build number), or the version and
      # a suffix for a candidate (v1.2.0, v1.2.0-rc.1).
      - name: Check that the tag is the version of the app
        if: ${{ github.event_name == 'push' }}
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
          if [ -z "${version}" ] || [ "${GITHUB_REF_NAME%%-*}" != "v${version}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not the version of the app (v${version} or v${version}-<suffix>, from pubspec.yaml)."
            exit 1
          fi

      # Only the presence of each value is tested, and only the names of the missing ones are written.
      - name: Find out which platforms can be released
        id: secrets
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          missing() {
            local names=()
            for name in "$@"; do
              if [ -z "${!name}" ]; then names+=("${name}"); fi
            done
            echo "${names[*]}"
          }
          report() {
            local platform="$1" absent="$2"
            if [ -z "${absent}" ]; then
              echo "${platform}=true" >> "$GITHUB_OUTPUT"
              echo "- ${platform}: all the signing and store values are set, the build and the upload run." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${platform}=false" >> "$GITHUB_OUTPUT"
              echo "- ${platform}: skipped, nothing is built or uploaded. Missing: ${absent}." >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          {
            echo '### Release'
            echo
            echo 'Nothing is deployed unless the signing and store values of a platform are all set (see docs/delivery.md).'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          report ios "$(missing IOS_BUNDLE_ID APPLE_TEAM_ID IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_BASE64)"
          report android "$(missing ANDROID_PACKAGE_NAME ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS PLAY_SERVICE_ACCOUNT_JSON_BASE64)"

  # A tag is built only if the code it points at passes the same checks as a pull request: every job
  # of the CI, since the result of this job is that of every job of the workflow it calls. Not run
  # by hand. A called workflow inherits the read-only permissions of this one, which are all it needs.
  ci:
    name: CI
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/ci.yml

  ios:
    name: Build and upload to TestFlight
    needs: [verify, ci]
    # Runs when the CI passed (a tag) or was not asked for (by hand), never when it failed, and
    # skipped (not failed) without the iOS values: the macOS runner is never started.
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.ios == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install the dependencies
        run: flutter pub get

      - name: Generate the code (build_runner)
        run: dart run build_runner build

      # The lane imports the certificate and the profile into a temporary keychain (ci_signing), then
      # builds the IPA. The secrets reach it as environment variables and are never written to the log.
      - name: Build the signed IPA
        working-directory: ios
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          BOARDROOM_ADAPTERS: ${{ vars.BOARDROOM_ADAPTERS }}
          BOARDROOM_API_BASE_URL: ${{ vars.BOARDROOM_API_BASE_URL }}
        run: bundle exec fastlane ios build

      - name: Upload the IPA to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: bundle exec fastlane ios beta

      - name: Keep the IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build and upload to Google Play (internal)
    needs: [verify, ci]
    # Same condition on the CI as iOS, and skipped (not failed) without the Android values.
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install the dependencies
        run: flutter pub get

      - name: Generate the code (build_runner)
        run: dart run build_runner build

      # The lane writes the upload keystore and android/key.properties (both ignored by Git), which
      # android/app/build.gradle.kts reads, then builds the bundle.
      - name: Build the signed app bundle
        working-directory: android
        env:
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BOARDROOM_ADAPTERS: ${{ vars.BOARDROOM_ADAPTERS }}
          BOARDROOM_API_BASE_URL: ${{ vars.BOARDROOM_API_BASE_URL }}
        run: bundle exec fastlane android build

      - name: Upload the bundle to the internal track
        working-directory: android
        env:
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: bundle exec fastlane android beta

      - name: Keep the app bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
