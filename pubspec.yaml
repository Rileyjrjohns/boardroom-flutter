name: boardroom
description: "Board meetings, documents and votes: the Flutter port of Boardroom."
# Private app, never published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

workspace:
  - packages/screen_protection

environment:
  sdk: ^3.13.3
  # Read by subosito/flutter-action (flutter-version-file: pubspec.yaml), so CI and local use one version.
  flutter: 3.47.4

dependencies:
  # Deep equality of lists and maps (DeepCollectionEquality), pure Dart: Result and the entities compare by value.
  collection: ^1.19.1
  # Connectivity changes of the device (wifi, mobile, none), behind the Connectivity port.
  connectivity_plus: ^7.3.2
  # SHA-256 of the file name of a downloaded document (lib/core/infrastructure/shared/sha256.dart); maintained by the Dart team, pure Dart.
  crypto: ^3.0.7
  # HTTP client of the real API: an interceptor that attaches the token, a response size limit, and an adapter seam that serves the fixtures in development.
  dio: ^5.11.1
  # Type-safe SQL over SQLite for the offline cache and the vote outbox (tables and queries are generated by drift_dev).
  drift: ^2.35.2
  flutter:
    sdk: flutter
  # gen-l10n output (AppLocalizations) depends on it: the localization delegates and the ARB message formatting.
  flutter_localizations:
    sdk: flutter
  # State management and dependency injection of the presentation: the providers that each feature declares and the composition overrides (docs/presentation.md).
  flutter_riverpod: ^3.4.3
  # Keychain (iOS) and Keystore (Android) storage for the tokens and the key of the encrypted database.
  flutter_secure_storage: ^11.2.0
  # Annotations (@freezed) read by the freezed generator for the immutable entities of the domain, pure Dart.
  freezed_annotation: ^3.1.0
  # The router: the routes of docs/spec/screens.md and the redirect driven by the access state of the session.
  go_router: ^18.1.1
  # Used by the generated AppLocalizations to format dates and plurals, and by the formatters of the screens.
  intl: ^0.20.3
  # Annotations (@JsonSerializable) read by json_serializable for the DTOs of the HTTP API, pure Dart.
  json_annotation: ^4.12.0
  # Fingerprint and face unlock, and the check that the device has a screen lock (the biometric gate).
  local_auth: ^3.0.2
  # AndroidAuthMessages (the label of the cancel button of the biometric prompt); local_auth does not re-export it.
  local_auth_android: ^2.3.0
  # IOSAuthMessages (the label of the cancel button and the fallback button of the prompt); local_auth does not re-export it.
  local_auth_darwin: ^2.0.5
  # @immutable on Result and the errors, whose equality is overridden; annotations only, pure Dart.
  meta: ^1.19.0
  # Folders of the application (documents, support) for the database file and the downloaded documents.
  path_provider: ^2.1.6
  # The annotations (@riverpod) read by riverpod_generator, which writes the providers and the notifiers of the presentation.
  riverpod_annotation: ^4.0.7
  # The local plugin that blocks screenshots and screen recording and reports attempts (FLAG_SECURE, privacy cover, secure view), behind the ScreenProtection port.
  screen_protection:
    path: packages/screen_protection
  # Opens the SQLite database of drift directly (NativeDatabase) and, through its build hook, bundles SQLite3MultipleCiphers, which reads and writes SQLCipher databases.
  sqlite3: ^3.7.1

dev_dependencies:
  # Parses the import/export/part directives in tool/check_imports.dart and the test names in tool/scenario_parity.dart (syntax only, no resolution).
  analyzer: ^13.3.0
  # Runs the code generators (freezed, json_serializable, drift): `dart run build_runner build`.
  build_runner: ^2.16.1
  # Generates the tables, the queries and the database class of the offline cache and the outbox (*.g.dart).
  drift_dev: ^2.35.1
  # Controls the clock of the timers in tests (a timer that is cancelled, a timeout that fires), without waiting.
  fake_async: ^1.3.3
  # Widget tests (pumpWidget, finders).
  flutter_test:
    sdk: flutter
  # Generates the *.freezed.dart files of the entities (equality, copyWith, toString).
  freezed: ^4.0.1
  # Generates the *.g.dart files that read and write the DTOs of the HTTP API.
  json_serializable: ^6.15.2
  # Joins and normalizes the paths of the files read by tool/check_imports.dart and tool/scenario_parity.dart.
  path: ^1.9.1
  # Generates the *.g.dart files of the providers and the notifiers (@riverpod).
  riverpod_generator: ^4.0.9
  # Lets the pure Dart layers (domain, application) run under plain `dart test`, without Flutter.
  test: ^1.31.1
  # Strict lint rule set, the base of analysis_options.yaml.
  very_good_analysis: 11.0.0

# Build hooks of the native packages. sqlite3 ships SQLite by default; this asks for SQLite3MultipleCiphers
# instead, whose `sqlcipher` cipher reads and writes SQLCipher 4 databases, on iOS, Android and the test host.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  # Generates lib/l10n output (AppLocalizations) from the ARB files, configured in l10n.yaml.
  generate: true
  uses-material-design: true
  # The fixtures of the specification: development builds serve them through the simulated server
  # (lib/app/dev/in_memory/fixtures); tests read the same files from disk.
  assets:
    - docs/spec/fixtures/accounts.json
    - docs/spec/fixtures/meetings.json
    - docs/spec/fixtures/recorded-votes.json
